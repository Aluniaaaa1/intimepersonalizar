name: Actualizar colores Original 011505
on:
  push:
    paths:
      - ".in-time-update-011505"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Actualizar nombres de colores
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='products.js';
          const source=fs.readFileSync(file,'utf8');
          const match=source.match(/window\.IN_TIME_PRODUCTS\s*=\s*([\s\S]*?)\s*;\s*$/);
          if(!match) throw new Error('No se pudo interpretar products.js');
          const products=JSON.parse(match[1]);
          const p=products.find(x=>x.id==='fruit-short-fruit-of-the-loom-original-t-hombre-61-082-0');
          if(!p) throw new Error('No se encontró el producto 011505');
          const names=[
            'Azul azure','Negro','Verde botella','Rojo teja','Granate',
            'Verde oliva','Azul marino oscuro','Fucsia','Gris jaspeado',
            'Verde kelly','Gris grafito','Verde lima','Azul marino',
            'Naranja','Púrpura','Rojo','Azul royal','Celeste',
            'Amarillo girasol','Blanco','Amarillo K2'
          ];
          const slugs=p.images.map(u=>(u.match(/sc6-([^/.]+)\.jpg$/)||[])[1]);
          const map={
            'azur-blue':'Azul azure','black':'Negro','bottle-green':'Verde botella',
            'brick-red':'Rojo teja','burgundy':'Granate','classic-olive':'Verde oliva',
            'deep-navy':'Azul marino oscuro','fuchsia':'Fucsia','heather-grey':'Gris jaspeado',
            'kelly-green':'Verde kelly','light-graphite':'Gris grafito','lime':'Verde lima',
            'navy':'Azul marino','orange':'Naranja','purple':'Púrpura','red':'Rojo',
            'royal-blue':'Azul royal','sky-blue':'Celeste','sunflower':'Amarillo girasol',
            'white':'Blanco','yellow':'Amarillo K2'
          };
          const colors=slugs.map(s=>map[s]);
          if(colors.length!==21 || colors.some(x=>!x)) throw new Error('No coincide el número de imágenes o hay un color sin nombre: '+JSON.stringify(slugs));
          p.colors=colors;
          p.features=p.features.filter(x=>!/^Colores disponibles:/i.test(x));
          p.features.push('Colores disponibles: '+colors.join(', '));
          fs.writeFileSync(file,'window.IN_TIME_PRODUCTS = '+JSON.stringify(products,null,2)+';\n');
          console.log('PRODUCTO',p.name);
          console.log('COLORES',JSON.stringify(p.colors));
          console.log('IMÁGENES',p.images.length,'COLORES',p.colors.length);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.js
          git commit -m "Actualizar colores del Fruit of the Loom Original 011505"
          git push origin HEAD:main
