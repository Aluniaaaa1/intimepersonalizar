name: Diagnosticar visor colores 011505
on:
  push:
    paths:
      - ".in-time-inspect-viewer"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Localizar código del visor
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          for(const term of ['product.images','p.images','product.colors','p.colors','images.map','colors.map','selectedColor','colorImages','gallery','image-gallery']){
            let pos=-1,count=0;
            while((pos=s.indexOf(term,pos+1))>=0 && count<5){
              console.log('\\n--- '+term+' @ '+pos+' ---\\n'+s.slice(Math.max(0,pos-700),Math.min(s.length,pos+1300)));
              count++;
            }
          }
          NODE
